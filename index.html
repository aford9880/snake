<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-grid"></div>

<div class="game-row">
  <!-- Вертикальный слайдер скорости -->
  <div class="speed-side">
    <div class="speed-side-label">Скорость</div>
    <input type="range" id="speedSlider" min="3" max="500" value="160" step="1">
    <span id="speedValue">160</span>
  </div>

  <!-- Игра -->
  <div class="game-column">
    <div class="header">
      <div class="score-wrap">
        <span class="score-label">Счёт</span>
        <span class="score" id="score">0</span>
      </div>
      <div class="stats">
        <div class="coins"><span class="coin-ico"></span> <span id="coins">0</span></div>
        <div class="high-score">Рекорд: <span id="highScore">0</span></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-chips" id="modeChips"></div>
      <div class="icon-btns">
        <button class="icon-btn" id="shopBtn" title="Магазин скинов">🛍️</button>
        <button class="icon-btn" id="muteBtn" title="Звук">🔊</button>
        <button class="icon-btn" id="pauseBtn" title="Пауза (P)">⏸️</button>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="game" width="500" height="500"></canvas>

      <!-- Экран Game Over / Победа -->
      <div id="overlay" class="overlay hidden">
        <h2 id="overlayTitle">GAME OVER</h2>
        <p id="overlaySub"></p>
        <div class="overlay-btns">
          <button id="reviveBtn" class="ad-btn">📺 Возродиться</button>
          <button id="x2Btn" class="ad-btn">📺 Удвоить очки</button>
          <button id="overlayRestart">Новая игра</button>
        </div>
      </div>
    </div>

    <div class="hud">
      <span id="status">← ↑ → ↓ / WASD · P — пауза</span>
      <div style="display:flex;gap:8px">
        <button id="autoBtn">✨ Авто</button>
        <button id="restartBtn">Новая игра</button>
      </div>
    </div>

    <div class="controls-hint">
      <span id="modeLabel">🎮 Управление: ручное</span>
    </div>
  </div>
</div>

<!-- Магазин скинов -->
<div id="shopModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Магазин скинов</h2>
      <div class="coins"><span class="coin-ico"></span> <span id="shopCoins">0</span></div>
      <button class="icon-btn" id="shopClose">✕</button>
    </div>
    <div id="skinList" class="skin-list"></div>
    <p class="shop-hint">Монеты начисляются за еду: +1 за обычную, +5 за бонусную ⭐, +100 за победу</p>
  </div>
</div>

<!-- Симуляция рекламы при локальной разработке (вне Яндекс Игр) -->
<div id="adSim" class="modal hidden">
  <div class="modal-card ad-sim-card">
    <h2>📺 Реклама</h2>
    <p>Локальная симуляция рекламы.<br>На Яндекс Играх здесь будет настоящий ролик.</p>
    <div class="ad-progress"><div id="adProgressBar"></div></div>
  </div>
</div>

<script src="js/platform.js"></script>
<script src="js/game.js"></script>
</body>
</html>
